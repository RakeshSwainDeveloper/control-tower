name: controltower

x-api-env: &api-env
  NODE_ENV: ${NODE_ENV:-development}
  LOG_LEVEL: ${LOG_LEVEL:-info}
  TZ: ${TZ:-Asia/Kolkata}
  DATABASE_URL: ${DATABASE_URL}
  DATABASE_POOL_MAX: ${DATABASE_POOL_MAX:-20}
  REDIS_URL: ${REDIS_URL}
  S3_ENDPOINT: ${S3_ENDPOINT}
  S3_PUBLIC_ENDPOINT: ${S3_PUBLIC_ENDPOINT}
  S3_REGION: ${S3_REGION}
  S3_ACCESS_KEY: ${S3_ACCESS_KEY}
  S3_SECRET_KEY: ${S3_SECRET_KEY}
  S3_BUCKET_EVIDENCE: ${S3_BUCKET_EVIDENCE}
  S3_FORCE_PATH_STYLE: ${S3_FORCE_PATH_STYLE}
  S3_SIGNED_URL_TTL_SECONDS: ${S3_SIGNED_URL_TTL_SECONDS}
  JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET}
  JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
  JWT_ACCESS_TTL: ${JWT_ACCESS_TTL}
  JWT_REFRESH_TTL: ${JWT_REFRESH_TTL}
  OTP_TTL_SECONDS: ${OTP_TTL_SECONDS}
  OTP_LENGTH: ${OTP_LENGTH}
  OTP_DEV_ECHO: ${OTP_DEV_ECHO}
  SMTP_HOST: ${SMTP_HOST}
  SMTP_PORT: ${SMTP_PORT}
  MAIL_FROM: ${MAIL_FROM}
  API_PORT: ${API_PORT:-3000}
  API_PUBLIC_URL: ${API_PUBLIC_URL}
  WEB_PUBLIC_URL: ${WEB_PUBLIC_URL}
  CORS_ORIGINS: ${CORS_ORIGINS}
  EVIDENCE_MAX_PHOTO_BYTES: ${EVIDENCE_MAX_PHOTO_BYTES}
  EVIDENCE_MAX_VIDEO_BYTES: ${EVIDENCE_MAX_VIDEO_BYTES}
  EVIDENCE_MAX_VIDEO_SECONDS: ${EVIDENCE_MAX_VIDEO_SECONDS}
  EVIDENCE_GALLERY_MAX_AGE_HOURS: ${EVIDENCE_GALLERY_MAX_AGE_HOURS}
  PLATFORM_BOOTSTRAP_EMAIL: ${PLATFORM_BOOTSTRAP_EMAIL}
  PLATFORM_BOOTSTRAP_PASSWORD: ${PLATFORM_BOOTSTRAP_PASSWORD}

services:

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_SUPERUSER}
      POSTGRES_PASSWORD: ${POSTGRES_SUPERUSER_PASSWORD}
      # passed to init scripts
      CT_APP_USER: ${POSTGRES_USER}
      CT_APP_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_SUPERUSER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    networks: [controltower]

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [controltower]

  minio:
    image: minio/minio:RELEASE.2024-10-13T13-34-11Z
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY}
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks: [controltower]

  minio-init:
    image: minio/mc:RELEASE.2024-10-08T09-37-26Z
    depends_on:
      minio: { condition: service_healthy }
    environment:
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
      S3_BUCKET_EVIDENCE: ${S3_BUCKET_EVIDENCE}
    entrypoint: ["/bin/sh", "/scripts/init.sh"]
    volumes:
      - ./infra/minio:/scripts:ro
    restart: "no"
    networks: [controltower]

  mailpit:
    image: axllent/mailpit:v1.21
    restart: unless-stopped
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: 1
      MP_SMTP_AUTH_ALLOW_INSECURE: 1
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 10s
      timeout: 3s
      retries: 10
    networks: [controltower]

  migrate:
    build:
      context: .
      dockerfile: infra/docker/api.Dockerfile
      target: runner
    environment: *api-env
    command: ["node", "dist/apps/api/src/cli/migrate.js", "up"]
    depends_on:
      postgres: { condition: service_healthy }
    restart: "no"
    networks: [controltower]

  api:
    build:
      context: .
      dockerfile: infra/docker/api.Dockerfile
      target: runner
    restart: unless-stopped
    environment: *api-env
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      minio: { condition: service_healthy }
      migrate: { condition: service_completed_successfully }
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:'+(process.env.API_PORT||3000)+'/api/v1/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    networks: [controltower]

  worker:
    build:
      context: .
      dockerfile: infra/docker/api.Dockerfile
      target: runner
    restart: unless-stopped
    environment:
      <<: *api-env
      ROLE: worker
    command: ["node", "dist/apps/worker/src/main.js"]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      migrate: { condition: service_completed_successfully }
    healthcheck:
      # The heartbeat file is refreshed only after a successful Redis ping, so
      # a stale file means the worker is not processing even if the PID lives.
      test: ["CMD", "node", "-e", "const s=require('fs').statSync('/tmp/worker-alive');process.exit(Date.now()-s.mtimeMs<45000?0:1)"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s
    networks: [controltower]

  web:
    build:
      context: .
      dockerfile: infra/docker/web.Dockerfile
      target: runner
      args:
        VITE_API_BASE_URL: /api/v1
    restart: unless-stopped
    depends_on:
      api: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/healthz"]
      interval: 10s
      timeout: 3s
      retries: 10
    networks: [controltower]

volumes:
  pgdata:
  redisdata:
  miniodata:

networks:
  controltower:
    driver: bridge
